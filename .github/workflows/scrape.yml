name: scrape

on:
  schedule:
    # All times UTC. Lima is UTC-5 year round. The pool opens 06:00 Lima = 11:00 UTC.
    #
    # 2026-09-09: measured schedule delivery over a full day. Of 14 due ticks in
    # the old twice-an-hour rush cron, only 3 runs actually landed (~21%). No
    # queued/skipped runs existed either: GitHub's scheduler never created them.
    # This is documented best-effort behavior on GitHub's side, not something a
    # cron expression can fix, so the mitigation is more independent ticks
    # rather than a "smarter" schedule. Every 5 minutes is GitHub's minimum
    # granularity.
    #
    # 10:00-16:55 UTC = 05:00-11:55 Lima. The window where sellouts happen.
    - cron: "*/5 10-16 * * *"
    # 17:00-04:55 UTC = 12:00-23:55 Lima. Slower half of the sale day, tightened
    # to the same cadence since delivery is unreliable everywhere, not just the
    # rush window.
    - cron: "*/5 17-23,0-4 * * *"
    # 05:17-10:17 UTC = 00:17-05:17 Lima. Pool frozen, heartbeat only.
    - cron: "17 5-9 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          # dl.google.com's Chrome apt repo intermittently serves a stale
          # Packages index against a fresher Release file, tripping a hash
          # mismatch (seen 2026-09-09T18:02Z). Refresh the index first, and
          # retry once since it's a transient mirror sync issue, not ours.
          sudo apt-get update || true
          playwright install --with-deps chromium || (sleep 10 && sudo apt-get update && playwright install --with-deps chromium)

      - name: Poll
        run: |
          # Cron now fires every 5 minutes across both selling-hours blocks, so
          # each run only needs to cover its own tick. Keep a short internal
          # loop in the 10:00-16:55 UTC rush window as insurance against a
          # single dropped tick, without running long enough to queue up
          # behind the next scheduled invocation.
          H=$(date -u +%H)
          if [ "$H" -ge 10 ] && [ "$H" -le 16 ]; then
            python scrape.py --debug --loop 10 --every 5
          else
            python scrape.py --debug
          fi

      - name: Keep evidence when it breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Commit any changes
        run: |
          git config user.name  "tuboleto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 3 attempts" && exit 1
