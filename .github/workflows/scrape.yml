name: scrape

on:
  schedule:
    # All times UTC. Lima is UTC-5 year round, no DST.
    # The board says "Inicia: 06:00 AM", so the pool opens at 06:00 Lima
    # (11:00 UTC) and nothing moves before it.
    #
    # 10:45-14:59 UTC = 05:45-09:59 Lima. Opening rush, every 5 minutes.
    - cron: "*/5 11-14 * * *"
    - cron: "45,50,55 10 * * *"
    # 15:00-04:59 UTC = 10:00-23:59 Lima. Rest of the sale day, every 10 minutes.
    - cron: "*/10 15-23,0-4 * * *"
    # 05:00-10:00 UTC = 00:00-05:00 Lima. Dead of night, hourly heartbeat only.
    - cron: "0 5-10 * * *"
    #
    # GitHub runs scheduled jobs late under load, sometimes by 15+ minutes, and
    # occasionally skips one. We record the real fetch time in ts_lima and treat
    # the schedule as a hint rather than a measurement.
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Poll
        run: python scrape.py

      - name: Commit any changes
        run: |
          git config user.name  "tuboleto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 3 attempts" && exit 1
