name: scrape

on:
  schedule:
    # All times UTC. Lima is UTC-5 year round. The pool opens 06:00 Lima = 11:00 UTC.
    # Deliberately off the top of the hour: GitHub drops :00 schedules first.
    #
    # 10:47-16:47 UTC = 05:47-11:47 Lima. The window where sellouts happen.
    # Each run polls internally for 25 min, so one surviving run still yields
    # five samples even if the scheduler eats the others.
    - cron: "17,47 10-16 * * *"
    # 17:17-04:47 UTC = 12:17-23:47 Lima. Slower half of the sale day.
    - cron: "17,47 17-23,0-4 * * *"
    # 05:17-10:17 UTC = 00:17-05:17 Lima. Pool frozen, heartbeat only.
    - cron: "17 5-9 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Poll
        run: |
          # Between 10:00 and 17:00 UTC (the selling window) hold the runner and
          # poll every 5 minutes, so a single surviving cron covers the gap left
          # by any that got dropped. Outside that, one poll and out.
          H=$(date -u +%H)
          if [ "$H" -ge 10 ] && [ "$H" -le 16 ]; then
            python scrape.py --debug --loop 25 --every 5
          else
            python scrape.py --debug
          fi

      - name: Keep evidence when it breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Commit any changes
        run: |
          git config user.name  "tuboleto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 3 attempts" && exit 1
